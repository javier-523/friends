default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

sqlite: &sqlite
  adapter: sqlite3
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  
development:
  primary:
    <<: *default
    url: <%= ENV['DEV_DATABASE_URL'] %>

  queue:
    <<: *sqlite
    database: storage/friends_dev_queue.sqlite3
    migrations_paths: db/queue_migrate

  cache:
    <<: *sqlite
    database: storage/friends_dev_cache.sqlite3
    migrations_paths: db/cache_migrate

  cable:
    <<: *sqlite
    database: storage/friends_dev_cable.sqlite3
    migrations_paths: db/cable_migrate

production:
  primary:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV['DATABASE_URL'] %>

  cache:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV['DATABASE_URL'] %>_cache
    migrations_paths: db/cache_migrate

  queue:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV['DATABASE_URL'] %>_queue
    migrations_paths: db/queue_migrate

  cable:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV['DATABASE_URL'] %>_cable
    migrations_paths: db/cable_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  url: <%= ENV['TEST_DATABASE_URL'] %>

